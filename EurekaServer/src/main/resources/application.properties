spring.application.name=EurekaServer


# The default port commonly used for Eureka servers
server.port=8761

# Tells the Eureka client NOT to register itself with this Eureka instance
eureka.client.register-with-eureka=false

# Tells the Eureka client NOT to pull registry information locally
eureka.client.fetch-registry=false


# Optional: Points to itself to prevent fallback/error logs looking for a cluster peer
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

