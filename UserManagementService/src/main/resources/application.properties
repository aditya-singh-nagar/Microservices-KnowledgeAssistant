# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://ep-shy-lab-b5afowu2-pooler.c-7.us-east-2.aws.neon.tech/Ums_db?user=neondb_owner&password=npg_vmsK3axj5tPz&sslmode=require&channelBinding=require
