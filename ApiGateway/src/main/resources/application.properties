spring.application.name=ApiGateway

#port
server.port=9090

#Eureka client communication
eureka.client.service-url.defaultZone = http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Force registration with IP (not hostname)
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

#Microservices Routes
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTHSERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=ums-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://UMSSERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**

